<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' http://127.0.0.1:* data: blob:; media-src 'self' http://127.0.0.1:* data: blob:; frame-src 'self' http://127.0.0.1:* data: blob:;">
<title>ShowSlate — Program Output</title>
<style>
  *{box-sizing:border-box; user-select:none; margin:0;}
  html,body{height:100%; overflow:hidden;
    font-family:-apple-system, "Helvetica Neue", system-ui, sans-serif;}
  body{background:#000; transition:background .15s;}
  body.idle{cursor:none;}
  body.flash::after{content:''; position:fixed; inset:0; background:var(--flashCol,#ff4540);
    z-index:50; animation:zflash .4s steps(2,start) 6; pointer-events:none;}
  @keyframes zflash{50%{opacity:0;}}

  #programSurface{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;isolation:isolate;transform-origin:0 0;will-change:transform;backface-visibility:hidden;}
  #programContent{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:0 0;will-change:transform;}
  #programSurface.mapping-source{opacity:0;pointer-events:none;}
  #mappingSurfaceHost{position:absolute;inset:0;z-index:20;display:none;overflow:hidden;isolation:isolate;background:#000;pointer-events:none;}
  #mappingSurfaceHost.active{display:block;}
  body.role-stream #mappingSurfaceHost{background:transparent;}
  .mapped-surface{position:absolute;overflow:visible;transform-origin:50% 50%;isolation:isolate;will-change:transform;}
  .mapped-surface-content{position:absolute;inset:0;overflow:visible;isolation:isolate;}
  .mapped-surface-frame{position:absolute;inset:0;overflow:visible;transform-origin:0 0;will-change:transform;backface-visibility:hidden;}
  .mapped-surface-clip{position:absolute;inset:0;overflow:hidden;isolation:isolate;}
  .mapped-program-clone{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0;will-change:transform;}
  .mapped-surface-label{position:absolute;z-index:80;left:10px;top:10px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px;border:1px solid rgba(255,255,255,.8);border-radius:3px;background:rgba(0,0,0,.72);color:#fff;font:700 12px/1.1 -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;}
  .mapped-runtime-grid{position:absolute;z-index:490;display:block;overflow:visible;pointer-events:none;}
  .mapping-filter-defs{position:absolute;width:0;height:0;overflow:hidden;}
  #sceneRoot{position:absolute; inset:0; z-index:auto; overflow:hidden; pointer-events:none; isolation:isolate;}
  .scene-layer{position:absolute; overflow:visible; display:flex; align-items:center; justify-content:center;
    opacity:var(--layerOpacity,1); transform:translateZ(0);}
  .scene-layer-content{position:absolute; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .scene-layer img,.scene-layer video,.scene-layer iframe,.scene-layer object{width:100%; height:100%; border:0; display:block;}
  .scene-layer.fit-contain img,.scene-layer.fit-contain video,.scene-layer.fit-contain iframe,.scene-layer.fit-contain object{object-fit:contain;}
  .scene-layer.fit-cover img,.scene-layer.fit-cover video{object-fit:cover;}
  .scene-layer.fit-fill img,.scene-layer.fit-fill video{object-fit:fill;}
  .scene-text{width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:1.5vmin; font-weight:780; line-height:1.05; white-space:pre-wrap; word-break:break-word;}
  .live-input-placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:3vh;background:#090b0e;color:#8c949f;font-size:2vh;font-weight:700;letter-spacing:.12em;text-align:center;text-transform:uppercase;}

  .scene-frame{position:absolute; inset:0;}
  #stage{position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center;}

  /* gornji tekst (labela / naziv koji korisnik ubaci) */
  #text{font-weight:600; line-height:1.1; text-align:center; padding:0 5vw;
    white-space:pre-wrap; word-break:break-word; display:none;}

  /* glavni tajmer */
  #timer{font-family:"SF Mono", ui-monospace, Menlo, monospace; font-weight:700;
    font-variant-numeric:tabular-nums; line-height:.95; white-space:nowrap;}

  /* donja poruka (alert) */
  #msg{position:absolute; z-index:180; bottom:7vh; left:0; right:0; text-align:center;
    font-size:6vh; font-weight:700; padding:0 5vw; line-height:1.15;
    white-space:pre-wrap; display:none;}
  #msg.flash{animation:pulse .8s steps(2,start) infinite;}
  #timer.neg{animation:pulse 1s steps(2,start) infinite;}
  @keyframes pulse{50%{opacity:.25;}}

  /* tanka traka napretka (opciono) */
  #prog{position:absolute; z-index:180; bottom:0; left:0; height:1vh; width:100%; display:none;}

  /* NOW / NEXT traka */
  #nownext{position:absolute; z-index:180; left:0; right:0; bottom:0; display:none; flex-direction:column;
    font-family:-apple-system, system-ui, sans-serif;}
  #nownext .nn{display:flex; justify-content:space-between; align-items:baseline; gap:3vw;
    padding:1.3vh 3.5vw; border-top:1px solid rgba(255,255,255,.13);}
  #nownext .nn .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  #nownext .nn .tag{flex:0 0 auto; font-size:1.9vh; letter-spacing:.18em; opacity:.55; font-weight:700;}
  #nownext .now .ttl{font-size:4vh;}
  #nownext .next{opacity:.62;} #nownext .next .ttl{font-size:3vh;}

  #blackout{position:absolute; inset:0; background:#000; z-index:500; display:block; opacity:0; pointer-events:none; transition:opacity .28s ease;}
  #blackout.on{opacity:1; pointer-events:auto;}
  #projectionCalibration{position:absolute;inset:0;z-index:490;display:none;pointer-events:none;border:2px solid rgba(255,255,255,.95);background-image:linear-gradient(rgba(255,255,255,.72) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.72) 1px,transparent 1px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.85);}
  #projectionCalibration::before,#projectionCalibration::after{content:'';position:absolute;background:rgba(255,70,70,.95);box-shadow:0 0 0 1px rgba(0,0,0,.8)}
  #projectionCalibration::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px)}
  #projectionCalibration::after{left:0;right:0;top:50%;height:2px;transform:translateY(-1px)}
  #lowerThird{position:fixed; z-index:200; display:none; align-items:center; gap:2.2vh; min-width:34vw; max-width:72vw;
    padding:2.1vh 2.8vh; color:#fff; border-radius:1.2vh; pointer-events:none;
    background:linear-gradient(180deg,rgba(18,19,23,.9),rgba(8,9,12,.88));
    border:1px solid rgba(255,255,255,.16); box-shadow:0 2.8vh 9vh rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
    animation:ltIn .22s ease-out both;}
  #ltCanvas{position:fixed; inset:0; z-index:210; display:none; pointer-events:none; overflow:hidden; isolation:isolate;}
  .lt-design-root{position:absolute; left:0; top:0; transform-origin:0 0; overflow:visible; pointer-events:none;}
  .lt-layer{position:absolute; overflow:hidden; pointer-events:none; transform-origin:50% 50%; contain:layout paint style;}
  .lt-layer img,.lt-layer video{display:block; border:0; user-select:none; -webkit-user-drag:none;}
  .lt-text-layer{display:flex; width:100%; height:100%; overflow:hidden;}
  .lt-text-content{min-width:0; max-width:100%; overflow:hidden; white-space:pre-wrap; word-break:break-word;}
  @keyframes ltIn{from{opacity:0;} to{opacity:1;}}
  #lowerThird.lt-bl{left:5vw; bottom:8vh; transform-origin:bottom left;}
  #lowerThird.lt-bc{left:50%; bottom:8vh; transform:translateX(-50%); transform-origin:bottom center;}
  #lowerThird.lt-br{right:5vw; bottom:8vh; transform-origin:bottom right;}
  #lowerThird.lt-tl{left:5vw; top:8vh; transform-origin:top left;}
  #lowerThird.lt-tc{left:50%; top:8vh; transform:translateX(-50%); transform-origin:top center;}
  #lowerThird.lt-tr{right:5vw; top:8vh; transform-origin:top right;}
  #lowerThird.lt-bc,#lowerThird.lt-tc{text-align:center;}
  #lowerThird.style-broadcast{border-left:.9vh solid var(--ltAccent,#30d158); border-radius:.8vh;}
  #lowerThird.style-glass{background:rgba(20,22,28,.56); backdrop-filter:blur(2.6vh) saturate(1.25);}
  #lowerThird.style-slab{background:#f5f5f7; color:#0d0e10; border-color:rgba(255,255,255,.5);}
  #lowerThird.style-slab .lt-title,#lowerThird.style-slab .lt-meta{color:rgba(0,0,0,.64);}
  #lowerThird.size-s{min-width:28vw; padding:1.6vh 2.1vh; gap:1.6vh;}
  #lowerThird.size-s #ltImg{width:6.4vh; height:6.4vh;}
  #lowerThird.size-s #ltName{font-size:3.3vh;}
  #lowerThird.size-s #ltTitle{font-size:1.9vh;}
  #lowerThird.size-l{min-width:42vw; padding:2.8vh 3.4vh; gap:2.8vh;}
  #lowerThird.size-l #ltImg{width:10vh; height:10vh;}
  #lowerThird.size-l #ltName{font-size:5.1vh;}
  #lowerThird.size-l #ltTitle{font-size:2.8vh;}
  #ltImg{width:8vh; height:8vh; object-fit:contain; display:none; flex:0 0 auto;}
  #ltCopy{min-width:0;}
  #ltName{font-weight:780; font-size:4.2vh; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #ltTitle{font-weight:560; font-size:2.3vh; color:rgba(255,255,255,.73); margin-top:.55vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #ltMeta{font-weight:700; font-size:1.65vh; color:rgba(255,255,255,.52); margin-top:.7vh; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  #roleView{position:fixed; inset:0; z-index:14; display:none; pointer-events:none; color:#f7f8fa; background:#080a0d;}
  .role-kicker{font-size:2.1vh; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#8d97a6;}
  .role-show{font-size:3.2vh; font-weight:720; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .role-clock{font:700 2.5vh/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9c1cb;}
  .role-current,.role-next{min-width:0;}
  .role-current strong,.role-next strong{display:block; overflow:hidden; text-overflow:ellipsis;}
  .role-current span,.role-next span{display:block; margin-top:1vh; color:#9aa4b2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  body.role-confidence #sceneRoot,body.role-confidence #lowerThird,body.role-confidence #ltCanvas,body.role-confidence #logo,body.role-confidence #nownext,body.role-confidence #prog{display:none!important;}
  body.role-confidence #roleView{display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding:4vh 4vw; background:#080a0d;}
  body.role-confidence .role-head{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:3vw;}
  body.role-confidence .role-show{margin-top:.8vh;}
  body.role-confidence .role-current{align-self:start; margin-top:3.5vh; max-width:76vw;}
  body.role-confidence .role-current strong{font-size:5.1vh; line-height:1.05;}
  body.role-confidence .role-current span{font-size:2.6vh;}
  body.role-confidence .role-next{align-self:end; padding-top:2.4vh; border-top:1px solid rgba(255,255,255,.16);}
  body.role-confidence .role-next strong{font-size:3.4vh; white-space:nowrap;}
  body.role-confidence .role-next span{font-size:2.1vh;}
  body.role-confidence #stage{inset:25% 4vw 22%!important; left:4vw!important; top:25%!important; right:4vw!important; bottom:22%!important; width:auto!important; height:auto!important; opacity:1!important; display:flex!important; z-index:16; align-items:flex-end; justify-content:center;}
  body.role-confidence #timer{font-size:min(18vw,25vh)!important;}
  body.role-confidence #msg{bottom:19vh; z-index:18; font-size:4.5vh; padding:1.4vh 3vw; color:#fff; background:#a02e2b;}
  body.role-timer #sceneRoot,body.role-timer #lowerThird,body.role-timer #ltCanvas,body.role-timer #logo,body.role-timer #nownext,body.role-timer #prog,body.role-timer #roleView{display:none!important;}
  body.role-timer #stage{inset:0!important; left:0!important; top:0!important; right:0!important; bottom:0!important; width:auto!important; height:auto!important; opacity:1!important; display:flex!important;}
  body.role-timer #text{display:none!important;}
  body.role-stream{background:transparent!important; transition:none!important;}
  body.role-stream #sceneRoot,body.role-stream #stage,body.role-stream #msg,body.role-stream #nownext,body.role-stream #prog,body.role-stream #roleView{display:none!important;}
  body.role-door #sceneRoot,body.role-door #stage,body.role-door #msg,body.role-door #nownext,body.role-door #prog,body.role-door #lowerThird,body.role-door #ltCanvas,body.role-door #logo{display:none!important;}
  body.role-door #roleView{display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:5vh; padding:6vh 6vw; background:#f4f1ea; color:#13161b;}
  body.role-door .role-head{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4vw; align-items:start; padding-bottom:3vh; border-bottom:2px solid rgba(19,22,27,.18);}
  body.role-door .role-kicker{color:#5c6570;}
  body.role-door .role-show{margin-top:1vh; font-size:4vh;}
  body.role-door .role-clock{font-size:3.2vh; color:#353d47;}
  body.role-door .role-current{align-self:center; max-width:88vw;}
  body.role-door .role-current strong{font-size:min(8vw,10vh); line-height:1.02; white-space:normal;}
  body.role-door .role-current span{font-size:3.2vh; color:#525c67; white-space:normal;}
  body.role-door .role-next{display:grid; grid-template-columns:auto minmax(0,1fr); align-items:baseline; gap:3vw; padding-top:3vh; border-top:2px solid rgba(19,22,27,.18);}
  body.role-door .role-next .role-kicker{white-space:nowrap;}
  body.role-door .role-next strong{font-size:4vh; white-space:nowrap;}
  body.role-door .role-next span{grid-column:2; font-size:2.4vh; color:#59636e;}

  /* providni (frameless) prozor — prevlačenje za pomeranje */
  body.overlay #stage{ -webkit-app-region: drag; }
</style>
</head>
<body>
  <div id="programSurface">
    <div id="programContent">
      <div id="sceneRoot"></div>
      <div id="stage">
        <div id="text"></div>
        <div id="timer">--:--</div>
      </div>
      <div id="msg"></div>
      <div id="nownext"></div>
      <div id="prog"></div>
      <img id="logo" alt="" style="display:none; position:fixed; z-index:5; pointer-events:none; max-width:40vw; object-fit:contain;">
      <div id="lowerThird">
        <img id="ltImg" alt="">
        <div id="ltCopy">
          <div id="ltName"></div>
          <div id="ltTitle"></div>
          <div id="ltMeta"></div>
        </div>
      </div>
      <div id="ltCanvas" aria-hidden="true"></div>
      <div id="roleView" aria-live="polite">
        <div class="role-head">
          <div><div class="role-kicker" id="roleRoomLabel">ROOM</div><div class="role-show" id="roleShowName">ShowSlate</div></div>
          <div class="role-clock" id="roleClock">--:--</div>
        </div>
        <div class="role-current"><div class="role-kicker" id="roleCurrentLabel">NOW</div><strong id="roleCurrent">Waiting for first cue</strong><span id="roleCurrentMeta"></span></div>
        <div class="role-next"><div class="role-kicker" id="roleNextLabel">NEXT</div><strong id="roleNext">—</strong><span id="roleNextMeta"></span></div>
      </div>
    </div>
    <div id="projectionCalibration" aria-hidden="true"></div>
  </div>
  <div id="mappingSurfaceHost" aria-hidden="true"></div>
  <div id="blackout"></div>

<script src="src/compositor/model.js"></script>
<script src="src/compositor/media-transport.js"></script>
<script src="src/live-input/consumer.js"></script>
<script src="i18n.js?v=20260703-i18n2"></script>
<script>
const IS_ELECTRON = !!window.pt;
const api = window.pt || null;
const PTCOMP = window.ShowSlateCompositor;
const PTMEDIA = window.ShowSlateMediaTransport;
const OUTPUT_QUERY = new URLSearchParams(location.search);
const OUTPUT_ROLES = ['audience','confidence','timer','stream','door'];
let outputRole = OUTPUT_ROLES.includes(OUTPUT_QUERY.get('outputRole')) ? OUTPUT_QUERY.get('outputRole') : 'audience';
const OUT_I18N = window.PT_I18N_OUTPUT || { en:{paused:'⏸ PAUSED', now:'NOW', next:'NEXT'}, sr:{paused:'⏸ PAUZA', now:'SADA', next:'SLEDI'} };
const langUtil = window.PT_I18N_UTIL || { normalizeLang:c=>(OUT_I18N[c]?c:'en'), langMeta:c=>({}) };
function outLang(){ return langUtil.normalizeLang((S && S.lang) || 'en'); }
function outT(key){ const l=outLang(); return (OUT_I18N[l] && OUT_I18N[l][key]) || OUT_I18N.en[key] || key; }

let S = null, prevRem = null, lastKey = '', lastSceneKey = '', lastLtRuntimeKey = '', ltSequenceTimer = null, lastMappedSurfaceKey = '', lastMappedDynamicSyncAt = 0;
let outputRenderDirty = true, lastDynamicRenderAt = 0, lastMappedRenderAt = 0;
const mappedRuntimeNodes = new Map();
const liveInputConsumer = IS_ELECTRON && window.ShowSlateLiveInput
  ? new window.ShowSlateLiveInput.LiveInputConsumer(api,{label:'output'}) : null;
let lastAckRevision = 0;
const ltPhaseMediaFailures = new Map();
const ltPhaseAnchors = new Map();
let isFS = false, fitMode = false, lastFitH = 0;   // kompaktan prozor (prati tajmer)
if (IS_ELECTRON) api.onWinFs(v => { isFS = !!v; lastKey = ''; lastFitH = 0; });

const FONT_MAP={mono:'"SF Mono",ui-monospace,Menlo,monospace',grotesk:'-apple-system,"Helvetica Neue",Arial,sans-serif',serif:'Georgia,"Times New Roman",serif',display:'"Arial Black",Impact,sans-serif'};
const $ = id => document.getElementById(id);
const LT_RENDER_DEBUG_PARAMS = new URLSearchParams(location.search);
const LT_RENDER_DEBUG_ENABLED = LT_RENDER_DEBUG_PARAMS.get('ptSmoke') === '1';
function updateLowerThirdRenderDebug(reason){
  if(!LT_RENDER_DEBUG_ENABLED) return;
  const canvas=$('ltCanvas');
  const legacy=$('lowerThird');
  const visible=el=>!!el && getComputedStyle(el).display!=='none' && getComputedStyle(el).visibility!=='hidden';
  const visibleLayers=canvas ? [...canvas.querySelectorAll('[data-layer-id]')].filter(visible) : [];
  window.__PT_LT_RENDER_DEBUG__={
    browserWindowId:Number(LT_RENDER_DEBUG_PARAMS.get('browserWindowId'))||0,
    webContentsId:Number(LT_RENDER_DEBUG_PARAMS.get('webContentsId'))||0,
    templateId:canvas ? (canvas.dataset.templateId||'') : '',
    instanceId:canvas ? (canvas.dataset.instanceId||'') : '',
    phase:canvas ? (canvas.dataset.phase||'') : '',
    renderedAt:Date.now(),
    reason:String(reason||''),
    visibleLayerCount:visibleLayers.length,
    renderedText:canvas ? [...canvas.querySelectorAll('.lt-text-content')].map(el=>el.textContent).join('|') : '',
    videoCount:canvas ? canvas.querySelectorAll('video').length : 0,
    legacyVisible:visible(legacy),
    runtimeVisible:visible(canvas)
  };
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtSecs(s, neg){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  return (neg?'−':'') + (h>0 ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`);
}
function fmtMs(ms){ return ms>=0 ? fmtSecs(Math.ceil(ms/1000),false) : fmtSecs(Math.floor(-ms/1000),true); }

function applyState(s){
  const fitStateChanged=!S || !!s.fitWindow!==!!S.fitWindow || !!s.gridOn!==!!S.gridOn;
  if (S && (s.mode!==S.mode || s.durationMs!==S.durationMs)) prevRem = null;
  S = s;
  outputRenderDirty = true;
  // Audio routing is a live safety control. Apply it immediately instead of
  // waiting for a potentially throttled animation frame.
  syncSceneMediaRuntime();
  outputRole = OUTPUT_ROLES.includes(s && s._outputRoute && s._outputRoute.role) ? s._outputRoute.role : outputRole;
  document.body.classList.remove(...OUTPUT_ROLES.map(role=>'role-'+role));
  document.body.classList.add('role-'+outputRole);
  document.body.dataset.outputRole=outputRole;
  const meta = langUtil.langMeta(outLang());
  document.documentElement.lang = outLang();
  document.documentElement.dir = meta.dir || 'ltr';
  applyOutputGeometry();
  // PRO: logo na ekranu
  const lg = $('logo');
  if (s.logo){
    const logoSource=mediaSrc(s.logo);
    if (lg.src !== logoSource) lg.src = logoSource;
    lg.style.height = (s.logoSize || 16) + 'vh';
    const m = '3vh', pos = s.logoPos || 'tr';
    lg.style.top = pos[0]==='t' ? m : ''; lg.style.bottom = pos[0]==='b' ? m : '';
    lg.style.left = pos[1]==='l' ? m : (pos[1]==='c' ? '50%' : '');
    lg.style.right = pos[1]==='r' ? m : '';
    lg.style.transform = pos[1]==='c' ? 'translateX(-50%)' : '';
    lg.style.display = 'block';
  } else lg.style.display = 'none';
  // State-driven overlays must not depend on a future animation frame. Chromium may
  // suspend RAF after repeated hidden/video viewport transitions during long shows.
  renderLowerThird();
  renderRoleView();
  scheduleOutputAcknowledgement(s);
  if(fitStateChanged) lastFitH=0;
  fitMode=IS_ELECTRON && !!S.fitWindow && !isFS && !S.gridOn;
  if(fitMode) requestFit();
}

function roleText(key){
  const sr=outLang()==='sr';
  const values={room:sr?'SALA':'ROOM',now:sr?'SADA':'NOW',next:sr?'SLEDI':'NEXT',waiting:sr?'Čeka se prva tačka':'Waiting for first cue'};
  return values[key] || key;
}
function cueMeta(cue){
  if(!cue) return '';
  return [cue.speakerName||cue.ltName||'',cue.speakerTitle||cue.ltTitle||'',cue.company||'',cue.room||''].filter(Boolean).join(' · ');
}
function renderRoleView(){
  if(!S) return;
  const cues=Array.isArray(S.cues)?S.cues:[];
  const index=Number.isInteger(S.currentCue)?S.currentCue:-1;
  const current=index>=0?cues[index]:null;
  let nextIndex=index+1;
  while(nextIndex<cues.length&&cues[nextIndex]&&cues[nextIndex].status==='skipped') nextIndex++;
  const next=nextIndex<cues.length?cues[nextIndex]:null;
  const details=S.show&&S.show.details||{};
  $('roleRoomLabel').textContent=details.room||details.venue||roleText('room');
  $('roleShowName').textContent=(S.show&&S.show.name)||'ShowSlate';

// Tajmer kao LEJER scene: prvi vidljivi 'timer' lejer određuje kutiju #stage;

// --- prijem stanja: Electron (IPC) ili browser/OBS (SSE) ---
if (IS_ELECTRON){
  api.onState(applyState);
} else {
  const connect = () => {
    const es = new EventSource('/events');
    es.onmessage = e => { try { applyState(JSON.parse(e.data)); } catch(_){} };
    es.onerror = () => { es.close(); setTimeout(connect, 1000); };

function render(frameNow){
  requestAnimationFrame(render);
  const frameTime=Number(frameNow)||performance.now();
  const now = Date.now();
  const d = new Date();

  // dok ne stigne stanje — prikaži tačno vreme
  if (!S){
    if(frameTime-lastDynamicRenderAt>=250){
      lastDynamicRenderAt=frameTime;
      paint(`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`, '#ffffff', '#000000', false, '', '', false, null);
    }
    return;
  }

  const projection=routeProjection();
  const mappedOutputActive=!!(projection&&Array.isArray(projection.surfaces));
  const mappingDue=mappedOutputActive&&frameTime-lastMappedRenderAt>=33;
  const timerScene=activeScene();
  const timerVisible=!!(timerScene&&Array.isArray(timerScene.layers)&&timerScene.layers.some(layer=>layer&&layer.visible!==false&&layer.type==='timer'));
  const dynamicInterval=timerVisible&&(S.running||S.mode==='clock')?(S.showProgress?33:100):250;
  const dynamicDue=frameTime-lastDynamicRenderAt>=dynamicInterval;
  if(!outputRenderDirty&&!dynamicDue&&!mappingDue)return;
  const renderStatic=outputRenderDirty;

  const bg = S.transparent ? 'transparent' : (S.bgColor || '#000000');
  document.body.classList.toggle('overlay', !!S.transparent);
  let fg = S.fgColor || '#ffffff';
  let text, neg = false, prog = null;

  if (S.mode === 'clock'){
    let h = d.getHours(), suf = '';
    if (S.clock12){ suf = h >= 12 ? ' PM' : ' AM'; h = h % 12 || 12; }
    text = `${S.clock12 ? h : pad(h)}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${suf}`;
  } else if (S.mode === 'countup'){
    const el = S.running ? S.elapsedMs + (now - S.startAt) : S.elapsedMs;
    text = fmtSecs(Math.floor(el/1000), false);
  } else {
    let rem = S.running ? S.endAt - now : S.remMs;
    if (!S.overtime && rem < 0) rem = 0;
    if (S.useWarnColors){
      if (rem <= S.redSec*1000) fg = S.warnRed || '#ff4540';
      else if (rem <= S.yellowSec*1000) fg = S.warnYellow || '#ffc23a';
    }
    if (rem < 0){ fg = S.warnRed || '#ff4540'; neg = true; }
    prog = S.durationMs > 0 ? Math.max(0, Math.min(1, rem / S.durationMs)) : 0;
    text = fmtMs(rem);
    if (S.running && S.flashZero && prevRem !== null && prevRem > 0 && rem <= 0) doFlash(fg);
    // PRO: zvučni signali na prelazima žuto/crveno/nula (samo dok tajmer radi)
    if (S.running && S.chimes && prevRem !== null){
      if (prevRem > 0 && rem <= 0) chime(3);
      else if (prevRem > S.redSec*1000 && rem <= S.redSec*1000) chime(2);
      else if (prevRem > S.yellowSec*1000 && rem <= S.yellowSec*1000) chime(1);
    }
    if (S.running) prevRem = rem;
  }

  // kompaktan prozor: kad NIJE fullscreen i opcija je uključena → tajmer puni širinu, prozor prati visinu
  // tajmer UVEK puni prozor; grid se realizuje veličinom/pozicijom samog PROZORA (main proces)
  if(renderStatic) applyTimerLayerStage();   // tajmer je LEJER scene: pozicionira/gasi #stage
  // fit (kompaktan prozor) — samo ako NIJE grid i NIJE fullscreen
  fitMode = IS_ELECTRON && !!S.fitWindow && !isFS && !S.gridOn;

  if(renderStatic){
    $('timer').style.fontFamily = FONT_MAP[S.font] || FONT_MAP.mono;
    renderScene();
  }
  if(renderStatic||dynamicDue){
    paint(text, fg, bg, neg, S.text || '', S.message ? S.message.text : '',
          S.message && S.message.flash, S.showProgress ? prog : null);
    lastDynamicRenderAt=frameTime;
  }

  if (fitMode&&(renderStatic||dynamicDue)) requestFit();
  if(renderStatic){
    renderNowNext(fg);
    renderLowerThird();
    $('blackout').classList.toggle('on', !!S.blackout);
  }
  if(renderStatic||mappingDue){
    renderMappedSurfaces();
    lastMappedRenderAt=frameTime;
  }
  outputRenderDirty=false;
}

// kompaktan prozor: traži od main-a da visina prozora bude tačno koliko i tajmer (+mali rub)
function requestFit(){
  const tEl=$('timer'), txtEl=$('text');
  if (tEl.style.display==='none') return;
  let h = tEl.getBoundingClientRect().height;
  if (txtEl.style.display!=='none') h += txtEl.getBoundingClientRect().height + h*0.06;
  const want = Math.round(h * 1.34);
  if (h > 4 && Math.abs(want - lastFitH) > 4){ lastFitH = want; api.fitWindow(want); }
}

function renderNowNext(fg){
  const el = $('nownext');
  const cues = S.cues || [];
  if (!S.showNowNext || S.currentCue == null || S.currentCue < 0 || !cues.length){
    el.style.display = 'none'; $('msg').style.bottom = '';
    return;
  }
  const cur = cues[S.currentCue], nxt = cues[S.currentCue + 1];
  const NOW = outT('now'), NEXT = outT('next');
  let html = `<div class="nn now"><span class="ttl"></span><span class="tag">${NOW}</span></div>`;
  if (nxt) html += `<div class="nn next"><span class="ttl"></span><span class="tag">${NEXT}</span></div>`;
  el.innerHTML = html;
  el.querySelector('.now .ttl').textContent = cur ? cur.name : '';
  if (nxt) el.querySelector('.next .ttl').textContent = nxt.name;
  el.style.color = fg;
  el.style.bottom = S.showProgress ? '1vh' : '0';
  el.style.display = 'flex';
  $('msg').style.bottom = nxt ? '17vh' : '12vh';
}

      if(offsetSec>0 && Number.isFinite(media.duration) && media.duration>0){
        const target=Math.min(offsetSec, Math.max(0, media.duration-0.05));
        el.dataset.startOffsetMs=String(Math.round(target*1000));
        let settled=false;
        const afterSeek=()=>{ if(settled) return; settled=true; begin(); };
        media.addEventListener('seeked', afterSeek, {once:true});
        try{ media.currentTime=target; }catch(e){ afterSeek(); }
        setTimeout(afterSeek, 500);
      } else begin();
    };
    media.addEventListener('loadeddata', ready, {once:true});
    media.addEventListener('canplay', ready, {once:true});
    media.addEventListener('ended', ()=>{
      el.dataset.ended='1';
      if(layer.playbackMode==='play-once-hide') el.style.display='none';
      if(layer.playbackMode==='play-once-hold') el.dataset.holdLastFrame='1';
    });
    media.onerror=()=>{
      el.dataset.error='media';
      el.style.display='none';
      recordLtPhaseMediaFailure(layer, canvas);
      if(canvas) canvas.dataset.lastError='media:'+String(layer.id||'');
    };
  }
  media.src=src;
  media.style.position='absolute';
  const crop=layer.crop || {};
  const top=Math.max(0, layerNumber(crop.top,0)), right=Math.max(0, layerNumber(crop.right,0));
  const bottom=Math.max(0, layerNumber(crop.bottom,0)), left=Math.max(0, layerNumber(crop.left,0));
  media.style.left=(-left)+'px'; media.style.top=(-top)+'px';
  media.style.width=`calc(100% + ${left + right}px)`;
  media.style.height=`calc(100% + ${top + bottom}px)`;
  media.style.objectFit=layer.fit==='fill' ? 'fill' : (layer.fit==='cover' ? 'cover' : 'contain');
  el.appendChild(media);
  return el;
}
function textLayerElement(layer){
  const el=document.createElement('div');
  el.className='lt-text-layer';
  const va=layer.verticalAlign || 'middle';
  el.style.alignItems=va==='top' ? 'flex-start' : (va==='bottom' ? 'flex-end' : 'center');
  el.style.justifyContent=layer.textAlign==='center' ? 'center' : (layer.textAlign==='right' ? 'flex-end' : 'flex-start');
  const pad=layer.padding || {};
  el.style.padding=[pad.top||0,pad.right||0,pad.bottom||0,pad.left||0].map(v=>Math.max(0, layerNumber(v,0))+'px').join(' ');
  const bg=layer.background || {};
  if(bg.enabled){
    el.style.background=bg.color || 'rgba(0,0,0,.55)';
    el.style.borderRadius=Math.max(0, layerNumber(bg.radius,0))+'px';
  }
  const tx=document.createElement('div');
  tx.className='lt-text-content';
  tx.textContent=String(layer.resolvedText != null ? layer.resolvedText : (layer.text || ''));
  tx.style.fontFamily=layer.fontFamily || '-apple-system, system-ui, sans-serif';
  tx.style.fontSize=Math.max(4, layerNumber(layer.fontSize,48))+'px';
  tx.style.fontWeight=String(layer.fontWeight || 700);
  tx.style.fontStyle=layer.fontStyle || 'normal';
  tx.style.color=layer.color || '#ffffff';
  tx.style.textAlign=layer.textAlign || 'left';
  tx.style.lineHeight=String(layer.lineHeight || 1.15);
  const maxLines=Math.max(1, Math.min(10, parseInt(layer.maxLines,10)||1));
  if(maxLines===1){
    tx.style.display='block';
    tx.style.whiteSpace='nowrap';
    tx.style.wordBreak='normal';
    tx.style.textOverflow='ellipsis';
  } else {
    tx.style.display='-webkit-box';
    tx.style.whiteSpace='pre-wrap';
    tx.style.wordBreak='break-word';
    tx.style.webkitBoxOrient='vertical';
    tx.style.webkitLineClamp=String(maxLines);
  }
  const outline=layer.outline || {};
  if(outline.enabled) tx.style.webkitTextStroke=Math.max(0, layerNumber(outline.width,2))+'px '+(outline.color||'#000');
  const sh=layer.shadow || {};
  if(sh.enabled) tx.style.textShadow=`${layerNumber(sh.offsetX,0)}px ${layerNumber(sh.offsetY,2)}px ${Math.max(0, layerNumber(sh.blur,8))}px ${sh.color||'rgba(0,0,0,.6)'}`;
  el.appendChild(tx);
  return el;
}
function textFitsLayer(el,tx){
  if(!el || !tx) return false;
  const style=getComputedStyle(el);
  const availableWidth=Math.max(0,el.clientWidth-parseFloat(style.paddingLeft||0)-parseFloat(style.paddingRight||0));
  const availableHeight=Math.max(0,el.clientHeight-parseFloat(style.paddingTop||0)-parseFloat(style.paddingBottom||0));
  return tx.scrollWidth<=availableWidth+1 && tx.scrollHeight<=availableHeight+1;
}
function autoFitTextLayer(el,layer){
  const tx=el&&el.querySelector('.lt-text-content');
  if(!tx || !layer || layer.autoFit===false) return;
  delete tx.dataset.autoFit;
  const preferred=Math.min(layerNumber(layer.fontSize,48),layerNumber(layer.maxFontSize,layerNumber(layer.fontSize,48)));
  const minimum=Math.min(preferred,layerNumber(layer.minFontSize,18));
  let low=minimum,high=preferred,best=minimum;
  tx.style.fontSize=high+'px';
  if(textFitsLayer(el,tx)) return;
  for(let i=0;i<10;i++){
    const mid=(low+high)/2;
    tx.style.fontSize=mid+'px';
    if(textFitsLayer(el,tx)){best=mid;low=mid;}else high=mid;
  }
  tx.style.fontSize=best+'px';
  tx.dataset.autoFit='1';
}
function shapeLayerElement(layer){
  const el=document.createElement('div');
  if(layer.shape==='line'){
    el.style.height=Math.max(1, layerNumber(layer.strokeWidth, Math.max(1, layer.height || 2)))+'px';
    el.style.top=(layerBox(layer).y + Math.max(0, layerNumber(layer.height,2))/2)+'px';
    el.style.background=layer.stroke || layer.fill || '#ffffff';
    el.style.borderRadius='999px';
  } else {
    el.style.background=layer.fill || 'rgba(0,0,0,.55)';
    if(layer.stroke){ el.style.border=Math.max(0, layerNumber(layer.strokeWidth,1))+'px solid '+layer.stroke; }
    el.style.borderRadius=(layer.shape==='roundedRectangle' ? Math.max(0, layerNumber(layer.radius,12)) : 0)+'px';
  }
  return el;
}
function renderResolvedLayer(layer, canvas, order){
  if(!layer || layer.visible===false) return null;
  const box=(layer.type==='media' || layer.type==='logo') ? mediaLayerElement(layer, canvas)
    : ((layer.type==='dynamicText' || layer.type==='staticText') ? textLayerElement(layer)
    : (layer.type==='shape' ? shapeLayerElement(layer) : null));
  if(!box) return null;
  setLayerBase(box, layer, order);
  return box;
}
function clearLtSequenceTimer(){
  if(ltSequenceTimer){ clearTimeout(ltSequenceTimer); ltSequenceTimer=null; }
}
function scheduleLtSequenceTick(ms){
  clearLtSequenceTimer();
  if(!Number.isFinite(ms)) return;
  const wait=Math.max(40, Math.min(260, ms));
  ltSequenceTimer=setTimeout(()=>{ ltSequenceTimer=null; lastLtRuntimeKey=''; renderLowerThird(); }, wait);
}
function lowerThirdPhaseConfig(rt, phase){
  const plan=(rt && rt.phasePlan) || {};
  return plan[phase] || null;
}
function lowerThirdPhaseDuration(phase, cfg, rt){
  const explicit=Number(rt && rt.phase===phase ? rt.phaseDurationMs : NaN);
  if(Number.isFinite(explicit) && explicit>=0) return explicit;
  const d=Number(cfg && cfg.durationMs);
  if(Number.isFinite(d) && d>=0) return d;
  if(phase==='intro') return 900;
  if(phase==='outro') return 700;
  return null;
}
function phaseMode(cfg){
  return String((cfg && cfg.mode) || 'static');
}
function effectiveLowerThirdRuntime(rt){
  const now=Date.now();
  const baseStarted=Number(rt.startedAt)||now;
  let phase=rt.phase || 'hold';
  let phaseStarted=Number(rt.phaseStartedAt)||baseStarted;
  phaseStarted=ltLocalPhaseStartedAt(rt, phase, phaseStarted);
  let cfg=lowerThirdPhaseConfig(rt, phase);
  let duration=lowerThirdPhaseDuration(phase, cfg, rt);
  if(phase==='intro' && duration != null && now-phaseStarted>=duration){
    phase='hold';
    phaseStarted=phaseStarted+duration;
    cfg=lowerThirdPhaseConfig(rt, phase);
    duration=lowerThirdPhaseDuration(phase, cfg, rt);
  }
  const plan=(rt && rt.phasePlan) || {};
  const phaseMediaIds=['intro','hold','outro']
    .map(name=>plan[name] && plan[name].mediaLayerId)
    .filter(Boolean);
  let activeMediaId=cfg && cfg.mediaLayerId;
  const failedAt=activeMediaId ? ltPhaseMediaFailures.get(ltPhaseMediaFailureKey(rt.instanceId, phase, activeMediaId)) : 0;
  if(failedAt && phase==='intro'){
    phase='hold';
    phaseStarted=failedAt;
    cfg=lowerThirdPhaseConfig(rt, phase);
    duration=lowerThirdPhaseDuration(phase, cfg, rt);
    activeMediaId=cfg && cfg.mediaLayerId;
  } else if(failedAt && phase==='outro'){
    return { hidden:true, nextTickMs:null };
  }
  if(phase==='outro' && duration != null && now-phaseStarted>=duration){
    return { hidden:true, nextTickMs:null };
  }
  const elapsed=Math.max(0, now-phaseStarted);
  const layers=[...(rt.resolvedLayers||[])].map(l=>Object.assign({}, l));
  const revealDelay=Math.max(0, Number((cfg && cfg.textRevealDelayMs)||0));
  const revealAt=phase==='intro' ? (phaseStarted + revealDelay) : 0;
  layers.forEach(layer=>{
    if((layer.type==='media' || layer.type==='logo') && phaseMediaIds.includes(layer.id) && activeMediaId && layer.id!==activeMediaId) layer.visible=false;
    if((layer.type==='dynamicText' || layer.type==='staticText') && phase==='intro' && now<revealAt) layer.visible=false;
    if((layer.type==='media' || layer.type==='logo') && cfg && cfg.mediaLayerId && layer.id===cfg.mediaLayerId){
      layer.__phaseMediaActive=true;
      layer.startOffsetMs=Math.max(0, Number(cfg.startOffsetMs)||0);
      if(phase==='hold') layer.playbackMode=cfg.loop ? 'loop-until-hide' : (cfg.holdLastFrame ? 'play-once-hold' : 'play-once-hide');
      if(phase==='intro' || phase==='outro') layer.playbackMode='play-once-hold';
    }
  });
  let opacity=1;
  const mode=phaseMode(cfg);
  const fadeDuration=Math.max(1, Number((cfg && cfg.transition && cfg.transition.durationMs) || duration || 220));
  if(phase==='intro' && (mode==='fade' || (cfg && cfg.transition && cfg.transition.type==='fade'))){
    opacity=Math.max(0, Math.min(1, elapsed/fadeDuration));
  } else if(phase==='outro' && (mode==='fade' || !cfg || (cfg.transition && cfg.transition.type==='fade'))){
    opacity=Math.max(0, Math.min(1, 1-(elapsed/fadeDuration)));
  }
  let nextTickMs=null;
  if(phase==='intro'){
    if(now<revealAt) nextTickMs=Math.max(40, revealAt-now);
    if(duration != null) nextTickMs=Math.min(nextTickMs==null?duration:nextTickMs, Math.max(40, duration-elapsed));
    if(opacity<1) nextTickMs=80;
  } else if(phase==='outro'){
    nextTickMs=opacity>0 ? 80 : 40;
  }
  return {
    runtime:Object.assign({}, rt, {
      phase, phaseStartedAt:phaseStarted, phaseDurationMs:duration,
      resolvedLayers:layers, sequenceOpacity:opacity
    }),
    hidden:false,
    nextTickMs
  };
}
function clearRuntimeLowerThird(){
  const canvas=$('ltCanvas');
  if(!canvas) return;
  clearLtSequenceTimer();
  canvas.querySelectorAll('video').forEach(v=>{ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} });
  canvas.replaceChildren();
  canvas.style.display='none';
  canvas.dataset.runtimeActive='0';
  canvas.dataset.templateId='';
  canvas.dataset.instanceId='';
  canvas.dataset.phase='';
  ltPhaseMediaFailures.clear();
  lastLtRuntimeKey='';
  updateLowerThirdRenderDebug('clear');
}
function renderRuntimeLowerThird(lt){
  const canvas=$('ltCanvas');
  if(!canvas) return false;
  if(!isLowerThirdRuntimeValid(lt)){
    clearRuntimeLowerThird();
    return false;
  }
  const eff=effectiveLowerThirdRuntime(lt.runtime);
  if(eff.hidden){
    clearRuntimeLowerThird();
    return true;
  }
  const rt=eff.runtime;
  const scaleSpec=runtimeScaleSpec(rt);
  const surface=$('programSurface');
  const key=(surface&&surface.clientWidth||innerWidth)+'x'+(surface&&surface.clientHeight||innerHeight)+'|'+JSON.stringify(rt);
  if(canvas.dataset.templateId!==(rt.templateId || '') || canvas.dataset.instanceId!==(rt.instanceId || '')){
    canvas.dataset.lastError='';
  }
  canvas.dataset.runtimeActive='1';
  canvas.dataset.templateId=rt.templateId || '';
  canvas.dataset.instanceId=rt.instanceId || '';
  canvas.dataset.phase=rt.phase || 'hold';
  canvas.dataset.scale=String(scaleSpec.scale);
  canvas.style.display='block';
  if(eff.nextTickMs != null) scheduleLtSequenceTick(eff.nextTickMs);
  if(key===lastLtRuntimeKey){ updateLowerThirdRenderDebug('runtime-stable'); return true; }
  lastLtRuntimeKey=key;
  canvas.querySelectorAll('video').forEach(v=>{ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} });
  canvas.replaceChildren();
  const root=document.createElement('div');
  root.className='lt-design-root';
  root.dataset.canvasWidth=String(scaleSpec.canvas.width);
  root.dataset.canvasHeight=String(scaleSpec.canvas.height);
  root.dataset.scale=String(scaleSpec.scale);
  root.style.width=scaleSpec.canvas.width+'px';
  root.style.height=scaleSpec.canvas.height+'px';
  root.style.opacity=String(Math.max(0, Math.min(1, Number(rt.sequenceOpacity ?? 1))));
  root.style.transform=`translate(${scaleSpec.left}px, ${scaleSpec.top}px) scale(${scaleSpec.scale})`;
  canvas.appendChild(root);
  [...(rt.resolvedLayers||[])]
    .map((layer,index)=>({layer,index,z:layerNumber(layer && layer.zIndex,0)}))
    .sort((a,b)=>(a.z-b.z) || (a.index-b.index))
    .forEach((entry,order)=>{
      const el=renderResolvedLayer(entry.layer, canvas, order + 1);
      if(el){ root.appendChild(el); if(entry.layer.type==='dynamicText' || entry.layer.type==='staticText') autoFitTextLayer(el,entry.layer); }
    });
  updateLowerThirdRenderDebug('runtime-render');
  return true;
}
function renderLowerThird(){
  const box=$('lowerThird');
  const lt=(S && S.lowerThird) || {};
  if(renderRuntimeLowerThird(lt)){
    box.style.display='none';
    updateLowerThirdRenderDebug('runtime-visible');
    return;
  }
  const visible=!!(lt.visible && (!lt.until || Date.now()<lt.until) && (lt.name || lt.title || lt.meta || lt.graphic));
  if(!visible){ box.style.display='none'; updateLowerThirdRenderDebug('hidden'); return; }
  box.className='lt-'+(lt.pos||'bl')+' style-'+(lt.style||'clean')+' size-'+(lt.size||'m');
  box.style.setProperty('--ltAccent', lt.accent || S.fgColor || '#30d158');
  $('ltName').textContent=lt.name||'';
  $('ltTitle').textContent=lt.title||'';
  $('ltMeta').textContent=lt.meta||'';
  $('ltTitle').style.display=lt.title?'block':'none';
  $('ltMeta').style.display=lt.meta?'block':'none';
  const img=$('ltImg');
  if(lt.graphic){ const src=mediaSrc(lt.graphic); if(img.src!==src) img.src=src; img.style.display='block'; }
  else { img.removeAttribute('src'); img.style.display='none'; }
  box.style.display='flex';
  updateLowerThirdRenderDebug('legacy-visible');
}

function paint(timeText, fg, bg, neg, bigText, msgText, msgFlash, prog){
  document.body.style.background = bg;

  const tEl = $('timer'), txtEl = $('text'), st = $('stage');
  // veličina referentne oblasti = #stage (ceo ekran, ili kockica grida)
  const sw = st.clientWidth || innerWidth, sh = st.clientHeight || innerHeight;
  const textOnly = S && S.textOnly && bigText;

  // tekst (labela ili samostalno)
  if (bigText){
    txtEl.style.display = 'block';
    txtEl.textContent = bigText;
    txtEl.style.color = fg;
    txtEl.style.fontSize = textOnly
      ? Math.min(sw*0.9/Math.max(6, bigText.length*0.55), sh*0.5) + 'px'
      : Math.min(sh*0.12, sw*0.06) + 'px';
    txtEl.style.marginBottom = textOnly ? '0' : (sh*0.02)+'px';
  } else {
    txtEl.style.display = 'none';
  }

  // tajmer
  if (textOnly){
    tEl.style.display = 'none';
  } else {
    tEl.style.display = 'block';
    tEl.textContent = timeText;
    tEl.style.color = fg;
    tEl.className = neg ? 'neg' : '';
    if (fitMode){
      // puni širinu prozora; rezervisana dužina (stabilna) da se prozor ne trza po cifri
      const refLen = Math.max(timeText.length, fmtMs(S.durationMs||0).length, 4);
      tEl.style.fontSize = Math.max(14, sw*0.86/(refLen*0.6)) + 'px';
    } else {
      const key = timeText.length + '|' + Math.round(sw) + 'x' + Math.round(sh) + '|' + (bigText?1:0);
      if (key !== lastKey){
        lastKey = key;
        const avail = bigText ? sh*0.6 : sh*0.7;
        tEl.style.fontSize = Math.min(sw*0.92/(timeText.length*0.6), avail) + 'px';
      }
    }
  }

  // poruka
  const mEl = $('msg');
  if (msgText){ mEl.style.display='block'; mEl.textContent=msgText; mEl.style.color=fg; mEl.className = msgFlash?'flash':''; }
  else mEl.style.display='none';

  // traka napretka
  const pEl = $('prog');
  if (prog !== null){ pEl.style.display='block'; pEl.style.width=(prog*100)+'%'; pEl.style.background=fg; }
  else pEl.style.display='none';
}

function doFlash(col){
  document.body.style.setProperty('--flashCol', col);
  document.body.classList.remove('flash'); void document.body.offsetWidth;
  document.body.classList.add('flash');
}

// PRO: chime — n kratkih tonova (1=žuto, 2=crveno, 3=nula); viši ton za nulu
let audioCtx = null;
function chime(n){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for(let i=0;i<n;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value = n===3 ? (i===2?1318:880) : (n===2?740:587);
      o.connect(g); g.connect(audioCtx.destination);
      const t=t0+i*0.28;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.5,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
      o.start(t); o.stop(t+0.26);
    }
  }catch(e){}
}
document.body.addEventListener('animationend', e => {
  if (e.target === document.body || e.animationName === 'zflash') document.body.classList.remove('flash');
});

// ---------- Electron-only: čist ekran, BEZ vidljivih kontrola (kontrola je u kontrolnom prozoru) ----------
// zadržano samo: sakrivanje kursora na mirovanje + nevidljive prečice (Esc / dupli klik za pun ekran)
if (IS_ELECTRON){
  let idleT=null;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT);
    idleT=setTimeout(()=>document.body.classList.add('idle'),2000); };
  document.addEventListener('mousemove', wake); wake();
  document.addEventListener('keydown', e => { if (e.key==='Escape') api.exitFullscreen(); });
  document.addEventListener('dblclick', () => api.toggleFullscreen());
}

window.addEventListener('resize', () => { outputRenderDirty=true; lastKey=''; lastLtRuntimeKey=''; lastMappedSurfaceKey=''; applyOutputGeometry(); renderLowerThird(); renderMappedSurfaces(); });
requestAnimationFrame(render);
